<!DOCTYPE html>
<html>
<head>

<title>Schema Questionnaire</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

body{
font-family:Arial;
max-width:900px;
margin:auto;
padding:40px;
line-height:1.6;
}

button{
margin:6px;
padding:10px 16px;
font-size:16px;
cursor:pointer;
}

#progress{
font-weight:bold;
margin-bottom:10px;
}

#progressbar{
width:100%;
height:12px;
background:#eee;
margin-bottom:20px;
}

#progressfill{
height:12px;
background:#4CAF50;
width:0%;
}

#question{
font-size:18px;
margin-bottom:20px;
}

#results{
margin-top:30px;
}

.controls{
margin-top:20px;
}

canvas{
margin-top:30px;
}

</style>

</head>

<body>

<h2>Schema Questionnaire</h2>

<p>
Client Name:<br>
<input id="clientName" style="width:300px">
</p>

<p>
Date:<br>
<input type="date" id="date">
</p>

<p>
Rating scale:<br>
1 = Completely untrue of me<br>
2 = Mostly untrue<br>
3 = Slightly more true than untrue<br>
4 = Moderately true of me<br>
5 = Mostly true of me<br>
6 = Describes me perfectly
</p>

<div id="progress"></div>

<div id="progressbar">
<div id="progressfill"></div>
</div>

<div id="question"></div>

<div id="answers">
<button onclick="answer(1)">1</button>
<button onclick="answer(2)">2</button>
<button onclick="answer(3)">3</button>
<button onclick="answer(4)">4</button>
<button onclick="answer(5)">5</button>
<button onclick="answer(6)">6</button>
</div>

<div id="results"></div>

<canvas id="schemaChart"></canvas>
<canvas id="domainChart"></canvas>

<div class="controls">
<button onclick="downloadPDF()">Download PDF</button>
<button onclick="window.print()">Print Results</button>
</div>

<script>

const questions = [

/* QUESTIONS OMITTED HERE FOR BREVITY IN THIS MESSAGE —
IN YOUR ACTUAL COPY YOU SHOULD KEEP THE SAME 90 QUESTIONS
YOU ALREADY HAVE IN YOUR FILE */

]

let current=0
let answers=[]

function showQuestion(){

document.getElementById("question").innerText=questions[current]

document.getElementById("progress").innerText=
"Question "+(current+1)+" of "+questions.length

let percent=(current/questions.length)*100
document.getElementById("progressfill").style.width=percent+"%"

}

function answer(value){

answers[current+1]=value
current++

if(current<questions.length){

showQuestion()

}else{

calculate()

}

}

function interpret(score){

if(score>=25) return "Very High"
if(score>=20) return "High"
if(score>=15) return "Medium"
if(score>=10) return "Low"
return "Very Low"

}

function calculate(){

const schemas={

"Emotional Deprivation":[1,19,37,55,73],
"Abandonment":[2,20,38,56,74],
"Mistrust":[3,21,39,57,75],
"Social Isolation":[4,22,40,58,76],
"Defectiveness":[5,23,41,59,77],
"Failure":[6,24,42,60,78],
"Dependence":[7,25,43,61,79],
"Vulnerability":[8,26,44,62,80],
"Enmeshment":[9,27,45,63,81],
"Subjugation":[10,28,46,64,82],
"Self-Sacrifice":[11,29,47,65,83],
"Emotional Inhibition":[12,30,48,66,84],
"Unrelenting Standards":[13,31,49,67,85],
"Entitlement":[14,32,50,68,86],
"Insufficient Self-Control":[15,33,51,69,87],
"Approval Seeking":[16,34,52,70,88],
"Negativity":[17,35,53,71,89],
"Punitiveness":[18,36,54,72,90]

}

let domainScores={
"Disconnection/Rejection":0,
"Impaired Autonomy":0,
"Impaired Limits":0,
"Other-Directedness":0,
"Overvigilance/Inhibition":0
}

let labels=[]
let scores=[]
let results=[]

let name=document.getElementById("clientName").value
let date=document.getElementById("date").value

let output="<h2>Schema Results</h2>"
output+="Client: "+name+"<br>"
output+="Date: "+date+"<br><br>"

for(let s in schemas){

let total=schemas[s].reduce((sum,i)=>sum+(answers[i]||0),0)

labels.push(s)
scores.push(total)
results.push({name:s,score:total})

output+=s+": "+total+" ("+interpret(total)+")<br>"

if(["Emotional Deprivation","Abandonment","Mistrust","Social Isolation","Defectiveness"].includes(s))
domainScores["Disconnection/Rejection"]+=total

if(["Failure","Dependence","Vulnerability","Enmeshment"].includes(s))
domainScores["Impaired Autonomy"]+=total

if(["Entitlement","Insufficient Self-Control"].includes(s))
domainScores["Impaired Limits"]+=total

if(["Subjugation","Self-Sacrifice","Approval Seeking"].includes(s))
domainScores["Other-Directedness"]+=total

if(["Emotional Inhibition","Unrelenting Standards","Negativity","Punitiveness"].includes(s))
domainScores["Overvigilance/Inhibition"]+=total

}

results.sort((a,b)=>b.score-a.score)

output+="<br><b>Top Schemas</b><br>"

for(let i=0;i<3;i++){
output+=results[i].name+" ("+results[i].score+")<br>"
}

output+="<br><h3>Schema Domains</h3>"

for(let d in domainScores){
output+=d+": "+domainScores[d]+"<br>"
}

output+="<br><h3>Clinical Summary</h3>"
output+="Primary pattern: "+Object.keys(domainScores).reduce((a,b)=>domainScores[a]>domainScores[b]?a:b)

document.getElementById("results").innerHTML=output

document.getElementById("answers").style.display="none"
document.getElementById("question").style.display="none"
document.getElementById("progress").style.display="none"
document.getElementById("progressbar").style.display="none"

new Chart(document.getElementById("schemaChart"),{
type:"bar",
data:{labels:labels,datasets:[{label:"Schema Scores",data:scores}]},
options:{scales:{y:{beginAtZero:true,max:30}}}
})

new Chart(document.getElementById("domainChart"),{
type:"bar",
data:{
labels:Object.keys(domainScores),
datasets:[{label:"Domain Scores",data:Object.values(domainScores)}]
},
options:{scales:{y:{beginAtZero:true}}}
})

}

function downloadPDF(){

html2pdf().from(document.body).save("schema-results.pdf")

}

showQuestion()

</script>

</body>
</html>
