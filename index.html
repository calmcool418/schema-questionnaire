<!DOCTYPE html>
<html>
<head>

<title>Schema Questionnaire</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

body{
font-family:Arial;
max-width:900px;
margin:auto;
padding:40px;
line-height:1.6;
}

button{
margin:6px;
padding:10px 16px;
font-size:16px;
cursor:pointer;
}

#progress{
font-weight:bold;
margin-bottom:10px;
}

#progressbar{
width:100%;
height:12px;
background:#eee;
margin-bottom:20px;
}

#progressfill{
height:12px;
background:#4CAF50;
width:0%;
}

#question{
font-size:18px;
margin-bottom:20px;
}

.controls{
margin-top:20px;
}

canvas{
margin-top:30px;
}

</style>

</head>

<body>

<h2>Schema Questionnaire</h2>

<p>
Client Name:<br>
<input id="clientName" style="width:300px">
</p>

<p>
Date:<br>
<input type="date" id="date">
</p>

<p>
Rating scale:<br>
1 = Completely untrue of me<br>
2 = Mostly untrue<br>
3 = Slightly more true than untrue<br>
4 = Moderately true of me<br>
5 = Mostly true of me<br>
6 = Describes me perfectly
</p>

<div id="progress"></div>

<div id="progressbar">
<div id="progressfill"></div>
</div>

<div id="question"></div>

<div id="answers">
<button onclick="answer(1)">1</button>
<button onclick="answer(2)">2</button>
<button onclick="answer(3)">3</button>
<button onclick="answer(4)">4</button>
<button onclick="answer(5)">5</button>
<button onclick="answer(6)">6</button>
</div>

<div id="results"></div>

<canvas id="schemaChart"></canvas>
<canvas id="domainChart"></canvas>

<div class="controls">
<button onclick="downloadPDF()">Download PDF</button>
<button onclick="window.print()">Print Results</button>
</div>

<script>

const questions=[

"I haven’t had someone to nurture me, share himself/herself with me, or care deeply about everything that happens to me.",
"I find myself clinging to people I’m close to because I’m afraid they’ll leave me.",
"I feel that people will take advantage of me.",
"I don’t fit in.",
"No man/woman I desire could love me once he or she saw my defects or flaws.",
"Almost nothing I do at work (or school) is as good as other people can do.",
"I do not feel capable of getting by on my own in everyday life.",
"I can’t seem to escape the feeling that something bad is about to happen.",
"I have not been able to separate myself from my parent(s) the way other people my age seem to.",
"I think that if I do what I want, I’m only asking for trouble.",

"I’m the one who usually ends up taking care of the people I’m close to.",
"I am too self-conscious to show positive feelings to others.",
"I must be the best at most of what I do; I can’t accept second best.",
"I have trouble accepting “no” for an answer.",
"I can’t seem to discipline myself to complete routine tasks.",
"Having money and knowing important people make me feel worthwhile.",
"Even when things go well, I feel it is only temporary.",
"If I make a mistake, I deserve to be punished.",
"I don’t have people to give me warmth and affection.",
"I need other people so much that I worry about losing them.",

"I cannot let my guard down with people.",
"I’m fundamentally different from others.",
"No one would want to stay close if they knew the real me.",
"I’m incompetent when it comes to achievement.",
"I think of myself as dependent in everyday life.",
"A disaster could strike at any moment.",
"My parents and I are over-involved in each other’s lives.",
"I feel I must give in to others.",
"I am a good person because I think of others first.",
"I find it embarrassing to express feelings.",

"I try to do my best; I can’t settle for good enough.",
"I’m special and shouldn’t have to follow many rules.",
"If I can’t reach a goal I get frustrated and quit.",
"Accomplishments matter most if people notice.",
"If something good happens I expect something bad.",
"If I don’t try my hardest I should expect to lose.",
"I haven’t felt special to someone.",
"I worry people I love will leave.",
"It’s only a matter of time before someone betrays me.",
"I don’t belong.",

"I’m unworthy of love or respect.",
"Most people are more capable than I am.",
"I lack common sense.",
"I worry about being attacked.",
"It’s difficult for my parents and me to keep boundaries.",
"In relationships I let the other person have control.",
"I’m so busy helping others I neglect myself.",
"I struggle to be spontaneous around people.",
"I must meet all responsibilities.",
"I hate being restricted.",

"I struggle to delay gratification.",
"I feel less important without attention.",
"You can’t be too careful; something will go wrong.",
"If I don’t do a job right I should suffer.",
"No one truly listens to me.",
"When someone pulls away I feel desperate.",
"I’m suspicious of others’ motives.",
"I feel cut off from people.",
"I feel unlovable.",
"I’m not as talented as most people.",

"My judgment can’t be trusted.",
"I worry about becoming poor.",
"My parents live through me.",
"I let others make choices for me.",
"I listen to everyone else’s problems.",
"I control my emotions too much.",
"There is constant pressure to achieve.",
"I shouldn’t have to follow normal rules.",
"I can’t force myself to do unpleasant tasks.",
"It’s important for me to receive admiration.",

"No matter how hard I work I could lose everything.",
"When I do something wrong I must pay.",
"I haven’t had wise guidance when uncertain.",
"I worry people will leave me.",
"I watch for hidden motives.",
"I feel like an outsider.",
"I’m too flawed to reveal myself.",
"I’m not as intelligent as most people.",
"I lack confidence solving problems.",
"I worry about serious illness.",

"I don’t have a separate identity from close others.",
"I struggle to demand respect.",
"I do too much for others.",
"People see me as emotionally controlled.",
"I can’t forgive myself for mistakes.",
"My contributions are more valuable than others.",
"I rarely keep resolutions.",
"Compliments make me feel worthwhile.",
"A wrong decision could lead to disaster.",
"I deserve punishment."

]

let current=0
let answers=[]

function showQuestion(){

document.getElementById("question").innerText=questions[current]

document.getElementById("progress").innerText=
"Question "+(current+1)+" of "+questions.length

let percent=(current/questions.length)*100
document.getElementById("progressfill").style.width=percent+"%"

}

function answer(value){

answers[current+1]=value
current++

if(current<questions.length){
showQuestion()
}else{
calculate()
}

}

function interpret(score){

if(score>=25) return "Very High"
if(score>=20) return "High"
if(score>=15) return "Medium"
if(score>=10) return "Low"
return "Very Low"

}

function calculate(){

const schemas={
"Emotional Deprivation":[1,19,37,55,73],
"Abandonment":[2,20,38,56,74],
"Mistrust":[3,21,39,57,75],
"Social Isolation":[4,22,40,58,76],
"Defectiveness":[5,23,41,59,77],
"Failure":[6,24,42,60,78],
"Dependence":[7,25,43,61,79],
"Vulnerability":[8,26,44,62,80],
"Enmeshment":[9,27,45,63,81],
"Subjugation":[10,28,46,64,82],
"Self-Sacrifice":[11,29,47,65,83],
"Emotional Inhibition":[12,30,48,66,84],
"Unrelenting Standards":[13,31,49,67,85],
"Entitlement":[14,32,50,68,86],
"Insufficient Self-Control":[15,33,51,69,87],
"Approval Seeking":[16,34,52,70,88],
"Negativity":[17,35,53,71,89],
"Punitiveness":[18,36,54,72,90]
}

let labels=[]
let scores=[]
let results=[]

let output="<h2>Schema Results</h2>"

for(let s in schemas){

let total=schemas[s].reduce((sum,i)=>sum+(answers[i]||0),0)

labels.push(s)
scores.push(total)
results.push({name:s,score:total})

output+=s+": "+total+" ("+interpret(total)+")<br>"

}

results.sort((a,b)=>b.score-a.score)

output+="<br><b>Top Schemas</b><br>"

for(let i=0;i<3;i++){
output+=results[i].name+" ("+results[i].score+")<br>"
}

document.getElementById("results").innerHTML=output

new Chart(document.getElementById("schemaChart"),{
type:"bar",
data:{labels:labels,datasets:[{label:"Schema Scores",data:scores}]},
options:{scales:{y:{beginAtZero:true,max:30}}}
})

}

function downloadPDF(){
html2pdf().from(document.body).save("schema-results.pdf")
}

showQuestion()

</script>

</body>
</html>
