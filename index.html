<!DOCTYPE html>
<html>
<head>

<title>Schema Questionnaire</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

body{
font-family:Arial;
max-width:900px;
margin:auto;
padding:40px;
line-height:1.6;
}

button{
margin:6px;
padding:10px 16px;
font-size:16px;
cursor:pointer;
}

#progress{
font-weight:bold;
margin-bottom:10px;
}

#progressbar{
width:100%;
height:12px;
background:#eee;
margin-bottom:20px;
}

#progressfill{
height:12px;
background:#4CAF50;
width:0%;
}

#question{
font-size:18px;
margin-bottom:20px;
}

.section{
margin-top:25px;
}

</style>

</head>

<body>

<h2>Schema Questionnaire</h2>

<p>
Client Name:<br>
<input id="clientName" style="width:300px">
</p>

<p>
Date:<br>
<input type="date" id="date">
</p>

<p>
Rating scale:<br>
1 = Completely untrue of me<br>
2 = Mostly untrue<br>
3 = Slightly more true than untrue<br>
4 = Moderately true of me<br>
5 = Mostly true of me<br>
6 = Describes me perfectly
</p>

<div id="progress"></div>

<div id="progressbar">
<div id="progressfill"></div>
</div>

<div id="question"></div>

<div id="answers">

<button onclick="answer(1)">1</button>
<button onclick="answer(2)">2</button>
<button onclick="answer(3)">3</button>
<button onclick="answer(4)">4</button>
<button onclick="answer(5)">5</button>
<button onclick="answer(6)">6</button>

</div>

<button onclick="previousQuestion()">Back</button>

<div id="report" style="display:none">

<h2>Schema Results</h2>

<p>
<strong>Client:</strong> <span id="rname"></span><br>
<strong>Date:</strong> <span id="rdate"></span>
</p>

<div class="section">
<h3>Top Schemas</h3>
<div id="topschemas"></div>
</div>

<div class="section">
<h3>Schema Domains</h3>
<div id="domains"></div>
</div>

<div class="section">
<h3>All Schema Scores</h3>
<div id="results"></div>
</div>

<div class="section">
<canvas id="schemaChart"></canvas>
</div>

</div>

<div style="margin-top:20px">

<button onclick="downloadPDF()">Download PDF</button>
<button onclick="window.print()">Print Results</button>

</div>

<script>

const questions=[

"I haven’t had someone to nurture me...",
"I find myself clinging to people...",
"I feel that people will take advantage of me.",
"I don’t fit in.",
"No man/woman I desire could love me once he or she saw my defects or flaws.",
"Almost nothing I do at work is as good as other people can do.",
"I do not feel capable of getting by on my own.",
"I feel something bad will happen.",
"I have difficulty separating from parents.",
"I feel trouble if I do what I want.",

"I take care of people close to me.",
"I feel self-conscious expressing feelings.",
"I must be the best.",
"I dislike hearing no.",
"I struggle completing routine tasks.",
"Status makes me feel worthwhile.",
"Good things feel temporary.",
"Mistakes deserve punishment.",
"I lack warmth from others.",
"I fear losing people.",

"I cannot let my guard down.",
"I feel different from others.",
"I feel flawed.",
"I feel incompetent.",
"I feel dependent.",
"I expect disasters.",
"I feel enmeshed with parents.",
"I give in to others.",
"I put others first.",
"I hide emotions.",

"I strive for perfection.",
"I feel special.",
"I quit when frustrated.",
"I want recognition.",
"I expect bad outcomes.",
"I must try hardest.",
"I feel unnoticed.",
"I fear abandonment.",
"I expect betrayal.",
"I feel I don't belong.",

"I feel unworthy.",
"I feel less capable.",
"I lack judgment.",
"I fear attacks.",
"I struggle with boundaries.",
"I give others control.",
"I neglect myself helping others.",
"I suppress spontaneity.",
"I must meet duties.",
"I dislike limits.",

"I cannot delay gratification.",
"I need attention.",
"I expect problems.",
"I punish myself.",
"I feel unheard.",
"I feel desperate if people pull away.",
"I distrust motives.",
"I feel disconnected.",
"I feel unlovable.",
"I feel less talented.",

"I distrust my judgment.",
"I fear poverty.",
"My parents live through me.",
"I let others decide.",
"I listen to everyone's problems.",
"I suppress feelings.",
"I feel pressure to achieve.",
"I dislike rules.",
"I avoid unpleasant tasks.",
"I seek admiration.",

"I fear losing everything.",
"I punish mistakes.",
"I lack guidance.",
"I fear abandonment.",
"I watch for betrayal.",
"I feel outsider.",
"I hide flaws.",
"I feel unintelligent.",
"I lack confidence.",
"I fear illness.",

"I lack identity separate from others.",
"I struggle asserting myself.",
"I overhelp others.",
"I appear emotionally controlled.",
"I cannot forgive mistakes.",
"I feel superior.",
"I break resolutions.",
"I rely on compliments.",
"I fear wrong decisions.",
"I deserve punishment."

]

let current=0
let answers=[]

function showQuestion(){

document.getElementById("question").innerText=questions[current]

document.getElementById("progress").innerText="Question "+(current+1)+" of "+questions.length

let percent=(current/questions.length)*100
document.getElementById("progressfill").style.width=percent+"%"

}

function answer(v){

answers[current+1]=v
current++

if(current<questions.length){
showQuestion()
}else{
calculate()
}

}

function previousQuestion(){

if(current>0){
current--
showQuestion()
}

}

function calculate(){

const schemas={
"Emotional Deprivation":[1,19,37,55,73],
"Abandonment":[2,20,38,56,74],
"Mistrust":[3,21,39,57,75],
"Social Isolation":[4,22,40,58,76],
"Defectiveness":[5,23,41,59,77],
"Failure":[6,24,42,60,78],
"Dependence":[7,25,43,61,79],
"Vulnerability":[8,26,44,62,80],
"Enmeshment":[9,27,45,63,81],
"Subjugation":[10,28,46,64,82],
"Self-Sacrifice":[11,29,47,65,83],
"Emotional Inhibition":[12,30,48,66,84],
"Unrelenting Standards":[13,31,49,67,85],
"Entitlement":[14,32,50,68,86],
"Insufficient Self-Control":[15,33,51,69,87],
"Approval Seeking":[16,34,52,70,88],
"Negativity":[17,35,53,71,89],
"Punitiveness":[18,36,54,72,90]
}

let results=[]
let labels=[]
let scores=[]

for(let s in schemas){

let total=schemas[s].reduce((sum,i)=>sum+(answers[i]||0),0)

results.push({schema:s,score:total})

labels.push(s)
scores.push(total)

}

results.sort((a,b)=>b.score-a.score)

document.getElementById("topschemas").innerHTML=
results.slice(0,3).map(x=>x.schema+" ("+x.score+")").join("<br>")

document.getElementById("results").innerHTML=
results.map(x=>x.schema+": "+x.score).join("<br>")

document.getElementById("rname").innerText=document.getElementById("clientName").value
document.getElementById("rdate").innerText=document.getElementById("date").value

document.getElementById("answers").style.display="none"
document.getElementById("question").style.display="none"
document.getElementById("progress").style.display="none"
document.getElementById("progressbar").style.display="none"

document.getElementById("report").style.display="block"

new Chart(document.getElementById("schemaChart"),{
type:"bar",
data:{labels:labels,datasets:[{label:"Schema Scores",data:scores}]},
options:{scales:{y:{beginAtZero:true,max:30}}}
})

}

function downloadPDF(){

const { jsPDF } = window.jspdf
const doc = new jsPDF()

let y=20

doc.setFontSize(18)
doc.text("Schema Results",20,y)
y+=10

doc.setFontSize(12)
doc.text("Client: "+document.getElementById("rname").innerText,20,y)
y+=8
doc.text("Date: "+document.getElementById("rdate").innerText,20,y)
y+=12

doc.setFontSize(14)
doc.text("Schema Scores",20,y)
y+=10

const lines=document.getElementById("results").innerText.split("\n")

doc.setFontSize(11)

lines.forEach(line=>{

if(y>270){
doc.addPage()
y=20
}

doc.text(line,20,y)
y+=7

})

doc.save("schema-results.pdf")

}

showQuestion()

</script>

</body>
</html>
